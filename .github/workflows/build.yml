name: Build and Release Binaries

# Сборка релизных бинарей на теге v* (и вручную). Релиз на GitHub создаётся
# только для тега.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux собирается на 22.04 (glibc 2.35): бинарь запускается на
          # большинстве живых дистрибутивов. CUDA компилируется без GPU на раннере:
          # fat binary Turing → Blackwell (real) + PTX для будущих карт.
          - name: Linux x86_64 (CUDA + Vulkan)
            os: ubuntu-22.04
            archive: monkey_bench_linux_x86_64.tar.gz
            cuda: true
            cmake_extra: '-DUSE_CUDA=ON "-DCMAKE_CUDA_ARCHITECTURES=75-real;80-real;86-real;89-real;90-real;120-real;120-virtual"'
          - name: Linux arm64 (Vulkan)
            os: ubuntu-22.04-arm
            archive: monkey_bench_linux_arm64.tar.gz
            cuda: false
            cmake_extra: '-DUSE_CUDA=OFF'
          # windows-2022 (VS2022): CUDA 12.8 поддерживает MSVC только до VS2022.
          - name: Windows x86_64 (CUDA + Vulkan)
            os: windows-2022
            archive: monkey_bench_windows_x86_64.zip
            cuda: true
            cmake_extra: '-DUSE_CUDA=ON "-DCMAKE_CUDA_ARCHITECTURES=75-real;80-real;86-real;89-real;90-real;120-real;120-virtual"'
          # Apple Silicon: Vulkan через MoltenVK, библиотека лежит в архиве рядом
          # с бинарём. Без неё бинарь работает на CPU и сообщает, что GPU нет.
          - name: macOS arm64 (Vulkan via MoltenVK)
            os: macos-14
            archive: monkey_bench_macos_arm64.zip
            cuda: false
            cmake_extra: '-DUSE_CUDA=OFF'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git sha и тег в build_info

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA Toolkit
        if: matrix.cuda
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.8.1'
          method: network
          sub-packages: '["nvcc", "cudart"]'
          use-github-cache: false
          use-local-cache: false

      # Vulkan нужен только для сборки (заголовки + glslangValidator): loader
      # грузится в рантайме, у пользователя он идёт с драйвером GPU.
      - name: Install Vulkan headers and glslang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev glslang-tools ninja-build

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.296.0
          install_runtime: false
          cache: true

      - name: Install Vulkan + MoltenVK (macOS)
        if: runner.os == 'macOS'
        run: brew install vulkan-headers vulkan-loader glslang molten-vk ninja

      # Релиз без -march=native: бинарь не должен падать с Illegal instruction.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMONKEY_NATIVE_ARCH=OFF -DMONKEY_BUILD_TESTS=OFF -DCMAKE_CUDA_COMPILER="$env:CUDA_PATH\bin\nvcc.exe" ${{ matrix.cmake_extra }}

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMONKEY_NATIVE_ARCH=OFF -DMONKEY_BUILD_TESTS=OFF ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build -j 4

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp build/monkey_bench README.md README.ru.md bench_output.schema.json dist/
          tar -C dist -czf ${{ matrix.archive }} .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp build/monkey_bench README.md README.ru.md bench_output.schema.json dist/
          cp "$(brew --prefix molten-vk)/lib/libMoltenVK.dylib" dist/
          cd dist && zip -r ../${{ matrix.archive }} .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/monkey_bench.exe, README.md, README.ru.md, bench_output.schema.json dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}

      # Смоук упакованного бинаря: запускается, находит (или честно не находит)
      # GPU, ядра этой сборки совпадают с golden.
      - name: Smoke test packaged binary
        shell: bash
        env:
          MVK_CONFIG_LOG_LEVEL: 3 # предупреждения и ошибки MoltenVK в лог
        run: |
          cd dist
          ./monkey_bench --version
          ./monkey_bench info
          ./monkey_bench verify

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # Необходимо для создания релиза: дефолтный GITHUB_TOKEN иначе read-only (403).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./binaries/**/*
          fail_on_unmatched_files: true
          body: |
            🐒 Infinite Monkey Benchmark — suite v1

            Run `monkey_bench` with no arguments: it runs the fixed suite on the CPU
            (single- and multi-thread) and on every available GPU API, checks every
            result against golden values and prints scores (1000 = Apple M4 Pro).
            `monkey_bench run --json result.json` writes a leaderboard-ready report.

            - **Windows x86_64 / Linux x86_64**: CUDA (NVIDIA) and Vulkan (any GPU).
            - **Linux arm64**: Vulkan.
            - **macOS arm64**: Vulkan via the bundled MoltenVK (`libMoltenVK.dylib`
              must stay next to the binary). Downloaded binaries are quarantined by
              Gatekeeper: `xattr -dr com.apple.quarantine .` in the unpacked folder.

            No SDK needed — only a normal GPU driver. Without a Vulkan/CUDA driver
            the binary runs the CPU categories and says why the GPU is unavailable.
            See the README for the methodology.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
